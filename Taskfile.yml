# Developer and operator entrypoints (plan leaf F-02). Requires Task 3.54.0
# (https://taskfile.dev); the pinned version and its checksums are recorded in
# docs/development.md. Every target wraps one repository command, so each also runs
# without Task: the command is shown in its description and in docs/development.md.
#
#   task setup     supported setup command: the basic-tier checks (standard library, offline), then
#                  tools:install (PyPI, once per lock) and the test suites under the tools interpreter
#   task qualify   setup, then full component resolution (network, several minutes)
#
# Override the interpreter with PYTHON, e.g.  task setup PYTHON="py -3"
version: '3'

vars:
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

env:
  AIEH_TASK_VERSION: '{{.TASK_VERSION}}'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - '"{{.TASK_EXE}}" --list'

  # setup runs the basic-tier checks first, with the plain PYTHON (standard library, offline), then
  # installs the python-tools set (PyYAML, Dulwich, urllib3, keyring; hash-locked, wheels only; PyPI once per
  # lock) and runs test under that set's interpreter (plan leaf F-10.1, decision 0014 section 9).
  setup:
    desc: "Run the qualification smoke checks: prereqs, verify and verify:baseline (standard library, offline), then tools:install (network, PyPI, once per lock) and test under the python-tools interpreter"
    cmds:
      - task: prereqs
      - task: verify
      - task: verify:baseline
      - task: tools:install
      - task: test

  # qualify is the release run (F-09.2): after the resolution it installs the dev tools venv, runs
  # test:all (with the Owner host's Vitest tests when Node.js 24 or later is present), and
  # hooks:verify, whose AIEH_GATE_REQUIRE_SCANNER=1 also runs the publication gate's nested
  # whole-tool-suite rerun (test 7).
  qualify:
    desc: setup, then component prerequisites, a full resolution into a new temporary directory, dev:install, test:all and hooks:verify
    vars:
      WORK:
        sh: '{{.PYTHON}} -I -c "import pathlib, tempfile; print(pathlib.Path(tempfile.mkdtemp(prefix=''aieh-resolve-'')).as_posix())"'
    cmds:
      - task: setup
      - task: prereqs:components
      - task: resolve
        vars:
          WORK: '{{.WORK}}'
      - task: dev:install
      - task: test:all
      - task: hooks:verify

  prereqs:
    desc: Check basic prerequisites (python -I -B tools/check_prereqs.py)
    cmds:
      - '{{.PYTHON}} -I -B tools/check_prereqs.py --tier basic'

  prereqs:components:
    desc: Check component-verification prerequisites (python -I -B tools/check_prereqs.py --tier components)
    cmds:
      - '{{.PYTHON}} -I -B tools/check_prereqs.py --tier components'

  prereqs:inventory:
    desc: Check the optional SBOM scan's host platform (python -I -B tools/check_prereqs.py --tier inventory)
    cmds:
      - '{{.PYTHON}} -I -B tools/check_prereqs.py --tier inventory'

  verify:
    desc: Verify the seed against SEED_MANIFEST.json in the working tree (python -I tools/verify_seed.py)
    cmds:
      - '{{.PYTHON}} -I tools/verify_seed.py'

  verify:baseline:
    desc: Verify the original seed import from git history (python -I tools/verify_seed.py --baseline seed)
    cmds:
      - '{{.PYTHON}} -I tools/verify_seed.py --baseline seed'

  # test runs every suite under the python-tools venv's interpreter, so that Dulwich and PyYAML are
  # present (plan leaves F-10.1 and F-10.2, decision 0014 section 9). TOOLS_PYTHON is that interpreter
  # for the current lock: locating it creates nothing and fails, naming tools:install, when the set
  # is not installed. PYTHON is overridden with it for test and test:serial; each suite target
  # test:serial calls resolves it the same way, so that it also runs under the tools interpreter when
  # run alone. test runs the suites concurrently (the Owner's direction of 2026-11-11: parallel by
  # default where deterministic and independent), each in its own process with its own empty data
  # root; test:serial lists them (tools/test_profile.py reads it) and runs them one after another.
  test:
    desc: "Under the python-tools interpreter (<tools python>: tools_install.py --python; needs tools:install): run the suites of test:serial concurrently, each in its own process with an empty data root of its own, and print each suite's output, a summary and the wall time (<tools python> -I -B tools/run_tests.py); -- --jobs N caps the suites at once, -- --suite NAME selects"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/run_tests.py {{.CLI_ARGS}}'

  test:serial:
    desc: "Under the python-tools interpreter (<tools python>: tools_install.py --python; needs tools:install): run, one after another, the tool tests (<tools python> -I -B -m unittest discover -s tools/tests -v), then the integration store tests (store:test), the effects store tests (effects:test), the planning adapter tests (planning:test), the lineage tests (lineage:test), the Owner decision recorder tests (owner:test), the managed data root tests (paths:test), the lifecycle contract and platform adapter tests (platform:test), the credential provider tests (credentials:test), the host Gitea tests (gitea:test), the dispatch input resolution and create admission tests (dispatch:test), the repository-access contract tests (repository:test) and the inference broker tests (inference:test)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s tools/tests -v'
      - task: store:test
      - task: effects:test
      - task: planning:test
      - task: lineage:test
      - task: owner:test
      - task: paths:test
      - task: platform:test
      - task: credentials:test
      - task: gitea:test
      - task: dispatch:test
      - task: repository:test
      - task: inference:test

  # Test profile and test check (plan leaf F-09.1; docs/development.md#testing), under the python-tools
  # interpreter, as test runs the suites (plan leaf F-10.2). test:budget is an acceptance obligation:
  # run it at the acceptance of every plan leaf and at every release, and record its result with the
  # leaf's evidence. Never run it from a git hook. It blocks on failing, removed or newly skipped
  # tests, categories and unit isolation; wall times and counters are diagnostics, never gates (the
  # Owner's direction of 2026-11-11).
  test:profile:
    desc: "Profile the suites of test (test:serial) serially under the python-tools interpreter, counting process launches, mkdtemp, sockets and chdir per test, class, category and suite (<tools python> -I -B tools/test_profile.py run); writes the profile to a new temporary directory; pass -- --runs 3 for wall-time medians"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/test_profile.py run {{.CLI_ARGS}}'

  test:categories:
    desc: Check that every test class declares a valid category under the python-tools interpreter, which has the modules the test modules import; imports the test modules, runs no test (<tools python> -I -B tools/test_profile.py categories)
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/test_profile.py categories {{.CLI_ARGS}}'

  test:budget:
    desc: "Acceptance obligation at every leaf acceptance and release, never in a hook: profile three serial runs under the python-tools interpreter and check them against the recorded test set (evidence/test-profile/test-ids.json): failing, removed or newly skipped tests, categories and unit isolation block; wall times and counters against policy/test-budgets.json are notes only (<tools python> -I -B tools/check_test_budget.py check --run); -- --counters-only profiles one run"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/check_test_budget.py check --run {{.CLI_ARGS}}'

  # Parallel runner (plan leaf F-09.2; docs/development.md#testing): pytest and pytest-xdist from the
  # hash-locked dev tools venv (dev:install) over the unchanged unittest suites, configured by
  # pyproject.toml and conftest.py (category markers, the unit guard). test and setup stay the stdlib
  # serial run. DEV_PYTHON is the venv's interpreter for the current lock; locating it creates
  # nothing and fails when dev:install has not run. -B and PYTHONDONTWRITEBYTECODE=1 (the xdist
  # workers do not inherit -B) keep bytecode out of the checkout; pyproject.toml disables pytest's
  # cache. The e2e (live) classes never run in parallel: they stay opt-in in their own targets.
  dev:install:
    desc: "Network (PyPI): install the hash-locked dev tools venv (pytest, pytest-xdist, and the python-tools set: PyYAML, Dulwich, urllib3, keyring) under the managed data root, wheels only (python -I -B integrations/paths/tools_install.py --set python-dev-tools)"
    cmds:
      - '{{.PYTHON}} -I -B integrations/paths/tools_install.py --set python-dev-tools'

  test:unit:
    desc: "Inner loop: the unit tests in parallel under the unit guard (<dev python> -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m unit); needs dev:install"
    vars:
      DEV_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --set python-dev-tools --python'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - '"{{.DEV_PYTHON}}" -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m unit {{.CLI_ARGS}}'

  test:fast:
    desc: "Inner loop: the unit and contract tests in parallel (<dev python> -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m \"unit or contract\"); needs dev:install"
    vars:
      DEV_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --set python-dev-tools --python'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - '"{{.DEV_PYTHON}}" -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m "unit or contract" {{.CLI_ARGS}}'

  test:component:
    desc: "Boundary: the contract and integration tests in parallel (<dev python> -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m \"contract or integration\"); needs dev:install"
    vars:
      DEV_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --set python-dev-tools --python'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - '"{{.DEV_PYTHON}}" -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m "contract or integration" {{.CLI_ARGS}}'

  test:all:
    desc: "Every suite but the live e2e classes, in parallel on at most 8 processes (<dev python> -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m \"not e2e\"), then the Owner host's Vitest tests when Node.js 24 or later is present (owner-host:test:if-node); needs dev:install"
    vars:
      DEV_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --set python-dev-tools --python'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - '"{{.DEV_PYTHON}}" -I -B -m pytest -n auto --maxprocesses 8 --dist loadscope -m "not e2e" {{.CLI_ARGS}}'
      - task: owner-host:test:if-node

  store:test:
    desc: Run the integration store tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/store/tests -v)
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/store/tests -v'

  store:init:
    desc: Create or migrate the integration store at an explicit path (python -I -B integrations/store/integration_store.py init --db DB)
    requires:
      vars: [DB]
    cmds:
      - '{{.PYTHON}} -I -B integrations/store/integration_store.py init --db "{{.DB}}"'

  store:path:
    desc: Print the default trusted-host store location without creating anything (python -I -B integrations/store/integration_store.py default-path)
    cmds:
      - '{{.PYTHON}} -I -B integrations/store/integration_store.py default-path'

  store:backup:
    desc: Back up the integration store with the SQLite backup API into <db dir>/backups/ and print the manifest (python -I -B integrations/store/integration_store.py backup --db DB --actor ACTOR)
    requires:
      vars: [DB, ACTOR]
    cmds:
      - '{{.PYTHON}} -I -B integrations/store/integration_store.py backup --db "{{.DB}}" --actor "{{.ACTOR}}"'

  store:restore:
    desc: "Restore a verified integration-store backup; opens a restore epoch (python -I -B integrations/store/integration_store.py restore --db DB --manifest MANIFEST --actor ACTOR); pass -- --accept-rollback only to accept a rollback"
    requires:
      vars: [DB, MANIFEST, ACTOR]
    cmds:
      - '{{.PYTHON}} -I -B integrations/store/integration_store.py restore --db "{{.DB}}" --manifest "{{.MANIFEST}}" --actor "{{.ACTOR}}" {{.CLI_ARGS}}'

  # Privileged effect store (plan leaf F-05.2, decision 0004). ROOT is always named and
  # must already exist (Owner act A4); there is no default path. Pass -- --principal SID
  # once the executor principal is part of the custody template.
  effects:test:
    desc: Run the effects store tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/effects/tests -v)
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/effects/tests -v'

  effects:init:
    desc: Create or migrate effects.sqlite inside an existing, Owner-created root; verifies location and custody (python -I -B integrations/effects/effects_store.py init --root ROOT)
    requires:
      vars: [ROOT]
    cmds:
      - '{{.PYTHON}} -I -B integrations/effects/effects_store.py init --root "{{.ROOT}}" {{.CLI_ARGS}}'

  effects:backup:
    desc: Back up the effects store into ROOT/backups/ and print the manifest (python -I -B integrations/effects/effects_store.py backup --root ROOT --actor ACTOR)
    requires:
      vars: [ROOT, ACTOR]
    cmds:
      - '{{.PYTHON}} -I -B integrations/effects/effects_store.py backup --root "{{.ROOT}}" --actor "{{.ACTOR}}" {{.CLI_ARGS}}'

  effects:restore:
    desc: "Owner act, elevated, executor stopped: restore a verified effects backup; opens a restore epoch (python -I -B integrations/effects/effects_store.py restore --root ROOT --manifest MANIFEST --actor ACTOR); pass -- --accept-rollback only to accept a rollback"
    requires:
      vars: [ROOT, MANIFEST, ACTOR]
    cmds:
      - '{{.PYTHON}} -I -B integrations/effects/effects_store.py restore --root "{{.ROOT}}" --manifest "{{.MANIFEST}}" --actor "{{.ACTOR}}" {{.CLI_ARGS}}'

  effects:verify-chain:
    desc: Verify the effects journal hash chain and every receipt; print the chain head (python -I -B integrations/effects/effects_store.py verify-chain --root ROOT)
    requires:
      vars: [ROOT]
    cmds:
      - '{{.PYTHON}} -I -B integrations/effects/effects_store.py verify-chain --root "{{.ROOT}}" {{.CLI_ARGS}}'

  # Planning adapter (plan leaf P-02.1): OpenSpec design references into Backlog.md tasks.
  # BACKLOG and OPENSPEC name the pinned tools' entry points, installed outside the
  # checkout (integrations/planning/README.md); PROJECT is the managed project's repository.
  # The adapter reads the repository through the shared repository-access module (Dulwich,
  # decision 0014), so its commands, like the lineage ones, run under the tools interpreter.
  planning:test:
    desc: "Run the planning adapter tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/planning/tests -v); the live tests run only when AIEH_BACKLOG and AIEH_OPENSPEC name the pinned tools"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/planning/tests -v'

  planning:create:
    desc: "Create a plan's Backlog.md tasks with OpenSpec source pointers at one design revision (<tools python> -I -B integrations/planning/planning_adapter.py create --project PROJECT --plan PLAN --revision REVISION --backlog BACKLOG [-- --openspec OPENSPEC])"
    requires:
      vars: [PROJECT, PLAN, REVISION, BACKLOG]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/planning/planning_adapter.py create --project "{{.PROJECT}}" --plan "{{.PLAN}}" --revision "{{.REVISION}}" --backlog "{{.BACKLOG}}" {{.CLI_ARGS}}'

  planning:resolve:
    desc: "Re-resolve OpenSpec source pointers; exit 1 on any missing revision, missing artifact, digest mismatch or task without a pointer (<tools python> -I -B integrations/planning/planning_adapter.py resolve --project PROJECT -- --backlog BACKLOG [--task ID] | --pointer P)"
    requires:
      vars: [PROJECT]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/planning/planning_adapter.py resolve --project "{{.PROJECT}}" {{.CLI_ARGS}}'

  planning:readiness:
    desc: "Report Backlog.md's own readiness per task (P-02.2): eligible only when Backlog.md says ready and every source pointer resolves; exit 1 on a missing dependency, a failing pointer or unknown readiness (<tools python> -I -B integrations/planning/planning_readiness.py --project PROJECT --backlog BACKLOG [-- --task ID --no-pointers])"
    requires:
      vars: [PROJECT, BACKLOG]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/planning/planning_readiness.py --project "{{.PROJECT}}" --backlog "{{.BACKLOG}}" {{.CLI_ARGS}}'

  # Lineage references (plan leaf P-03.1): typed source references, their schema and the
  # read-only resolvers (integrations/lineage/README.md).
  lineage:test:
    desc: "Run the lineage reference, resolver and traversal tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/lineage/tests -v); the live tests run only when AIEH_BACKLOG and AIEH_OPENSPEC name the pinned tools"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/lineage/tests -v'

  lineage:schema:
    desc: Check the lineage reference schema against the typed references and list each kind's status (python -I -B integrations/lineage/lineage_resolve.py schema)
    cmds:
      - '{{.PYTHON}} -I -B integrations/lineage/lineage_resolve.py schema'

  lineage:resolve:
    desc: "Resolve lineage references read-only; exit 1 on any outcome other than resolved (<tools python> -I -B integrations/lineage/lineage_resolve.py resolve REF ... [--current] [--project DIR] [--backlog CMD] [--repo NAME=DIR] [--effects-root DIR])"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/lineage/lineage_resolve.py resolve {{.CLI_ARGS}}'

  # Lineage traversal (plan leaf P-03.2): the read-only projection from one outcome id.
  lineage:trace:
    desc: "Project the lineage of one outcome read-only with the real authorities; exit 1 when the projection carries uncertainty (<tools python> -I -B integrations/lineage/lineage_trace.py trace OUTCOME --project DIR [--backlog CMD] [--store DB])"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/lineage/lineage_trace.py trace {{.CLI_ARGS}}'

  lineage:example:
    desc: "Rebuild the lineage projection example offline and print each projection's verdict; pass -- --record to rewrite integrations/lineage/examples/ (<tools python> -I -B integrations/lineage/tests/lineage_example.py)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/lineage/tests/lineage_example.py {{.CLI_ARGS}}'

  # Owner decisions (plan group P-04): the shared Owner decision record and the acceptance
  # recorder (plan leaf P-04.1, decision 0008; integrations/owner/README.md). The recorder commits
  # in process through the repository-access module (decision 0014), so it needs the tools venv.
  owner:test:
    desc: "Run the Owner decision recorder tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/owner/tests -v): the shared owner-decision/v1 record and statement verdicts, the recorder's edits of proposal.md and .openspec.yaml, and prepare and record on throwaway fixture repositories (the lineage objective resolver round trip, the id kept on re-recording, every refusal with its code and remedy; synthetic statements only); the authorization recorder (P-04.2) against a fake Gitea, in memory and over an in-process loopback HTTP server (one merge per recorded decision, every refusal with its code, the lost answer resolved by reading, fail closed without a verified protection answer); the live exercise on the S-01.2.2 fixture skips unless AIEH_AUTHZ_RECORDER_LIVE names a phase (prepare, then record)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/owner/tests -v'

  owner:accept:
    desc: "The acceptance recorder (<tools python> -I -B integrations/owner/acceptance_recorder.py <command>): pass -- prepare --project DIR --change NAME --item O<n> [--expires-in-minutes N] [--out FILE] to print the challenge to show the Owner (writes nothing), or -- record --project DIR --challenge FILE --statement FILE --recorded-by ATTRIBUTION --identity 'Name <email>' [--amend] to record the Owner's statement, mint or keep the outcome id and commit; exit 2 on a refusal, with its code and remedy"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/owner/acceptance_recorder.py {{.CLI_ARGS}}'

  owner:authorize:
    desc: "The Owner authorization recorder (<tools python> -I -B integrations/owner/authorization_recorder.py <command>; plan leaf P-04.2), run only in the main session on an Owner decision: pass -- prepare OWNER/NAME PULL [--expires-in-minutes N] to write the challenge to show the Owner to the recorder's state, -- record --challenge NONCE --statement FILE --recorded-by ATTRIBUTION to record the Owner's statement and merge the challenged head as aieh-owner, or -- resolve --challenge NONCE to resolve an unknown outcome by reading (never merging); record refuses PROTECTION_UNVERIFIED or PROTECTION_DRIFT unless the protection check of decision 0012 point 6 (OA-16, gitea:protection-check) answers verified immediately before the merge; exit 2 on a refusal, 1 on a failed or unknown outcome"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/owner/authorization_recorder.py {{.CLI_ARGS}}'

  # Managed data root (plan leaf F-07.1, decision 0009): the shared path resolver, its
  # configuration and the Python tools venv (integrations/paths/README.md).
  paths:test:
    desc: "Run the managed data root resolver tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/paths/tests -v); the config.yml tests skip when PyYAML is not importable"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/paths/tests -v'

  # The host-service lifecycle contract and the Windows adapter (plan leaf F-06.2; draft decision 0011):
  # integrations/platform/, composed by integrations/gitea/gitea_host.py.
  platform:test:
    desc: "Run the lifecycle contract and platform adapter tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/platform/tests -v): verbs, records, refusal codes and remedies, transitions over a fake service, the exposure guard; the Windows adapter's declarations and refusals with fakes, and its listener, token and identity reads of the test process (Windows)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/platform/tests -v'

  # The harness's credential provider (plan leaf F-06.3; draft decision 0011 section 3):
  # integrations/credentials/, which the platform adapter supplies to gitea_host.py and gitea_roles.py.
  credentials:test:
    desc: "Run the credential provider tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/credentials/tests -v): the provider contract suite over a fake, the Windows provider (an in-memory advapi32; Windows) and keyring with an in-process backend; the fail-closed factory and its refusals; keyring's own selection and configuration shown ignored; doctor; the credential acts' integration-store receipts on a fixture store; the throwaway-name cross-read across processes (a test-only file backend; the real-store mode is opt-in, AIEH_CREDENTIALS_REAL_STORE=1)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/credentials/tests -v'

  credentials:doctor:
    desc: "Report the credential provider the harness chooses on this system and its viability; reads, writes and lists no entry and prints no secret; exit 0 viable, 2 refused (<tools python> -I -B integrations/credentials/credential_provider.py doctor)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/credentials/credential_provider.py doctor'

  paths:show:
    desc: "Print the managed data root and its categories; creates nothing (python -I -B integrations/paths/aieh_paths.py show); pass -- --format sh or -- --format ps1 for shell assignments"
    cmds:
      - '{{.PYTHON}} -I -B integrations/paths/aieh_paths.py show {{.CLI_ARGS}}'

  paths:init:
    desc: Create the managed data root, its persistent/, ephemeral/ and assets/ directories and its marker (python -I -B integrations/paths/aieh_paths.py init)
    cmds:
      - '{{.PYTHON}} -I -B integrations/paths/aieh_paths.py init'

  paths:doctor:
    desc: Report the managed data root, what exists, its marker and the legacy locations; moves and changes nothing (python -I -B integrations/paths/aieh_paths.py doctor)
    cmds:
      - '{{.PYTHON}} -I -B integrations/paths/aieh_paths.py doctor'

  tools:install:
    desc: "Network (PyPI, once per lock): install the hash-locked Python tools venv (PyYAML, for config.yml; Dulwich and urllib3, for the Python components' repository operations) under the managed data root, wheels only; part of setup, and test runs under its interpreter (python -I -B integrations/paths/tools_install.py)"
    cmds:
      - '{{.PYTHON}} -I -B integrations/paths/tools_install.py'

  # Trusted dispatch input resolution (plan leaf E-01.2.1; decisions 0009 and 0010): the resolver,
  # the approved-input manifest's schema check and its managed location; and the create admission
  # (plan leaf E-01.2.2; decisions 0001 and 0003) (integrations/dispatch/README.md).
  dispatch:test:
    desc: Run the dispatch input resolution and create admission tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/dispatch/tests -v)
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/dispatch/tests -v'

  # Repository access (plan leaf F-10.2, decision 0014): the shared module over Dulwich and its
  # differential contract suite, recorded expectations over git-built golden repositories and a
  # git-oracle comparison that skips, naming why, where git is not on PATH
  # (integrations/repository/README.md). Without Dulwich the suite fails with
  # REPOSITORY_NEEDS_DULWICH, never skips.
  repository:test:
    desc: "Run the repository-access contract tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/repository/tests -v); the git-oracle half skips, naming why, where git is not on PATH"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/repository/tests -v'

  # The inference broker (plan leaf S-03.2, slice 1; decision 0015 as amended): integrations/inference/,
  # built and tested offline. The suite uses synthetic keys, an in-memory credential provider, a fixture
  # integration store and a fake upstream per declared API family on ephemeral 127.0.0.1 ports in the test
  # process; it never touches the real credential store, the managed root or the network beyond loopback.
  inference:test:
    desc: "Run the inference broker tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/inference/tests -v): the family declarations and components.inference_broker configuration with every refusal; token issuance, family binding, revocation, expiry and budgets with their integration-store receipts; every admission refusal; untranslated pass-through and streaming to a fake upstream per declared family with the synthetic provider key substituted for the attempt token; usage extraction; the audit and the I7 scan; egress to the configured origin only; the credential set command over an in-memory provider; serve in process"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/inference/tests -v'

  dispatch:check-manifest:
    desc: Schema-check an approved-input manifest file; admits nothing (python -I -B integrations/dispatch/dispatch_inputs.py check-manifest --manifest MANIFEST)
    requires:
      vars: [MANIFEST]
    cmds:
      - '{{.PYTHON}} -I -B integrations/dispatch/dispatch_inputs.py check-manifest --manifest "{{.MANIFEST}}"'

  dispatch:manifest-path:
    desc: Print where the live approved-input manifest is expected under the managed data root; creates nothing (python -I -B integrations/dispatch/dispatch_inputs.py manifest-path)
    cmds:
      - '{{.PYTHON}} -I -B integrations/dispatch/dispatch_inputs.py manifest-path'

  # Host-loopback Gitea (plan leaf F-06.1; decisions 0007 and 0009): the pinned Windows binary
  # as an asset, its state under the managed data root, run inside a supervising managed
  # environment whose kill-on-close Job Object ends Gitea with it (integrations/gitea/README.md).
  gitea:test:
    desc: "Run the host Gitea tests under the python-tools interpreter (<tools python> -I -B -m unittest discover -s integrations/gitea/tests -v); the live lifecycle test runs only when AIEH_GITEA_BINARY names a copy of the pinned binary, and the live authorization tests only with AIEH_GITEA_AUTHZ=1 (gitea:authz)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/gitea/tests -v'

  gitea:install:
    desc: "Network (GitHub, once): create the managed data root, download the pinned Gitea Windows binary into assets/ and verify it against the lock, and write app.ini with Gitea-generated secrets (python -I -B integrations/gitea/gitea_host.py install); pass -- --port N or -- --from-file EXE"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py install {{.CLI_ARGS}}'

  gitea:up:
    desc: Start the managed environment (a supervisor holding a kill-on-close Job Object) and Gitea inside it on 127.0.0.1, and wait until it answers (python -I -B integrations/gitea/gitea_host.py up)
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py up'

  gitea:down:
    desc: Stop Gitea through its own manager shutdown, then the supervisor; terminating the supervisor ends Gitea through the job (python -I -B integrations/gitea/gitea_host.py down)
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py down'

  gitea:status:
    desc: Report the supervisor, Gitea, its listeners, token elevation and job; changes nothing (python -I -B integrations/gitea/gitea_host.py status)
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py status'

  gitea:verify:
    desc: "Run the F-06.1 proof set against the running instance: pin, loopback-only listeners, no elevation, the kill-on-close job, resolver paths outside the checkout, refused sign-up and anonymous API, no Gitea secret in the checkout; exit 1 on any failed check (<tools python> -I -B integrations/gitea/gitea_host.py verify)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py verify {{.CLI_ARGS}}'

  # The host-service lifecycle contract's further verbs (plan leaf F-06.2; integrations/platform/).
  gitea:restart:
    desc: Down (when running) and up again under a write-ahead aieh-service-transition/1 record; an interrupted restart is resumed by gitea:recover (python -I -B integrations/gitea/gitea_host.py restart)
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py restart'

  gitea:inspect:
    desc: "Report the platform record (aieh-platform/1), the desired, staged and running versions, the supervisor and Gitea with their listeners (TCP table) and user identity (process token), the supervision record and the transitions; changes nothing (python -I -B integrations/gitea/gitea_host.py inspect)"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py inspect'

  gitea:upgrade:
    desc: "Upgrade to a pinned version under a write-ahead transition record: stage and verify the asset, stop, back up gitea.db (SQLite backup API) and app.ini, start the target, check readiness; roll back automatically before verification; refuses VERSION_MISMATCH, DOWNGRADE_REFUSED and TRANSITION_PENDING; network once unless --from-file (python -I -B integrations/gitea/gitea_host.py upgrade --to VERSION); pass -- --to VERSION [--from-file EXE]"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py upgrade {{.CLI_ARGS}}'

  gitea:recover:
    desc: Reconcile the actual state with a pending transition record first, then resume it or roll it back; with nothing pending, report the reconciled state (python -I -B integrations/gitea/gitea_host.py recover)
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py recover'

  gitea:uninstall:
    desc: "Refused while Gitea runs (UNINSTALL_RUNNING); empties the ephemeral tmp/gitea only and deletes nothing under persistent/ and no asset, under a transition record (python -I -B integrations/gitea/gitea_host.py uninstall)"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py uninstall'

  gitea:identities:
    desc: "Create the site administrator and the non-administrator Owner account with Gitea's CLI, each with a random temporary password, written only into the credential provider (Windows Credential Manager) until gitea:finalize-credentials replaces it (python -I -B integrations/gitea/gitea_host.py identities)"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py identities'

  gitea:finalize-credentials:
    desc: "Owner directive of 2026-11-07, no Owner sign-in: replace both temporary passwords with harness-held final ones (generated, stored in the credential provider first, set through Gitea's forced change), revoke every token of both accounts, verify, delete the temporary entries, and check no password is in the managed root, the checkout or the output (<tools python> -I -B integrations/gitea/gitea_host.py finalize-credentials)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_host.py finalize-credentials'

  # Segregated role credentials (plan leaf S-01.2.2; decision 0007): restricted Bot accounts, their
  # narrowest tokens in Credential Manager ("AIEH Gitea bot <role>"), the authorization fixture and the
  # live denial tests (integrations/gitea/README.md).
  gitea:roles:
    desc: "Role bots and the authorization fixture (python -I -B integrations/gitea/gitea_roles.py <command>): pass -- provision | fixture [--admin-merge-probe] | escape-probe | rotate ROLE | retire ROLE | status; fixture and escape-probe need gitea:finalize-credentials first"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/gitea_roles.py {{.CLI_ARGS}}'

  gitea:protection-check:
    desc: "The protection check of decision 0012 point 6 (Owner decision OA-16; python -I -B integrations/gitea/protection_check.py <command>): pass -- verify OWNER/NAME [--base BRANCH] to read the admitted repository's protection as the read-only protection auditor (its Credential Manager entry, in memory) and print the verdict; exit 0 verified, 1 drift, 2 unverified or refused"
    cmds:
      - '{{.PYTHON}} -I -B integrations/gitea/protection_check.py {{.CLI_ARGS}}'

  gitea:authz:
    desc: "Live authorization tests of the role bots against the running Gitea, opt-in through AIEH_GITEA_AUTHZ=1 (python -I -B -m unittest discover -s integrations/gitea/tests -p test_authorization_live.py -v); reads the bot tokens from Credential Manager into memory; the fixture tests skip until the fixture exists"
    env:
      AIEH_GITEA_AUTHZ: '1'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/gitea/tests -p test_authorization_live.py -v'

  gitea:transport:
    desc: "Live qualification of the repository module's transports against the running Gitea (plan leaf F-10.6), opt-in through AIEH_GITEA_TRANSPORT=1 (<tools python> -I -B -m unittest discover -s integrations/gitea/tests -p test_transport_live.py -v): each bot's push matrix of gitea:authz replayed through the module, and a module clone checked by git fsck --strict; reads the bot tokens from Credential Manager into memory; adds one commit to builder's and planner's proposal branches, as gitea:authz does"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    env:
      AIEH_GITEA_TRANSPORT: '1'
    cmds:
      - '{{.PYTHON}} -I -B -m unittest discover -s integrations/gitea/tests -p test_transport_live.py -v'

  # Owner host (plan leaf U-01.1): the React shell in apps/owner-host. These targets need
  # the component tier (Node.js >= 24, npm >= 11), so they are not part of setup or test.
  owner-host:install:
    desc: "Install the Owner host's locked npm dependencies without install scripts; needs Node 24, npm 11 and the npm registry (npm ci --ignore-scripts --no-audit --no-fund, in apps/owner-host)"
    dir: apps/owner-host
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund

  owner-host:typecheck:
    desc: Type-check the Owner host (npm run typecheck, in apps/owner-host)
    dir: apps/owner-host
    cmds:
      - npm run typecheck

  owner-host:test:
    desc: Run the Owner host's component, routing and compatibility tests in jsdom (npm test, in apps/owner-host)
    dir: apps/owner-host
    cmds:
      - npm test

  # Part of test:all (and of qualify through it), F-09.2: only when Node.js 24 or later is present,
  # over the locked install of owner-host:install, with Vitest's result and module caches off so
  # that nothing is written inside the checkout.
  owner-host:test:if-node:
    desc: "When Node.js 24 or later is present: the Owner host's Vitest tests, the canvas-compat contract file among them, without Vitest caches (npm test -- --no-cache --no-fsModuleCache, in apps/owner-host); otherwise says they were skipped"
    dir: apps/owner-host
    cmds:
      - |
        if node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 24 ? 0 : 1)'; then
          if [ ! -d node_modules ]; then
            echo "apps/owner-host has no node_modules: run task owner-host:install (npm ci --ignore-scripts) first"
            exit 1
          fi
          npm test -- --no-cache --no-fsModuleCache
        else
          echo "Node.js 24 or later not found: the Owner host Vitest tests were skipped"
        fi

  owner-host:build:
    desc: Build the Owner host into apps/owner-host/dist (npm run build, in apps/owner-host)
    dir: apps/owner-host
    cmds:
      - npm run build

  profile:check:
    desc: Check the execution-profile declarations (python -I -B tools/check_profile.py); pass -- --strict to fail on unknown pins
    cmds:
      - '{{.PYTHON}} -I -B tools/check_profile.py {{.CLI_ARGS}}'

  security:check:
    desc: "Check the security inventory (S-01.1): python -I -B tools/check_security_inventory.py; pass -- --list to print each privileged operation's principal"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_security_inventory.py {{.CLI_ARGS}}'

  security:containment-check:
    desc: "Check the containment case catalogue and its expected-denial matrix (S-02.1): python -I -B tools/check_containment_cases.py; pass -- --list to print each case's category, kind and positive control, or -- --render for the README block"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_containment_cases.py {{.CLI_ARGS}}'

  policy:check:
    desc: "Check the role-token matrix and revocation contract (S-01.2.1): python -I -B tools/check_role_tokens.py; pass -- --list to print each role's grants, or -- --render for the README tables"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_role_tokens.py {{.CLI_ARGS}}'

  policy:network-check:
    desc: "Check the deny-by-default network matrix (S-01.4): python -I -B tools/check_network_matrix.py; pass -- --list to print each edge's verdict and status, or -- --render for the README tables"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_network_matrix.py {{.CLI_ARGS}}'

  policy:ci-check:
    desc: "Check the CI runner control profile, the CI token and secret policy and the governance workflow (Q-02.1): python -I -B tools/check_ci_policy.py; pass -- --list to print the lanes, Owner acts and facts, or -- --render for the README block"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_ci_policy.py {{.CLI_ARGS}}'

  policy:control-check:
    desc: "Check the control catalog (G-01.1): python -I -B tools/check_control_catalog.py; pass -- --list to print each control's subject, profiles and enforcers, or -- --render for the generated block of policy/control-catalog.md"
    cmds:
      - '{{.PYTHON}} -I -B tools/check_control_catalog.py {{.CLI_ARGS}}'

  intent:check:
    desc: "Check a proposal's intent record (P-01.1): python -I -B tools/check_intent_record.py PROPOSAL --source REF=FILE (pass each quote's source after --)"
    requires:
      vars: [PROPOSAL]
    cmds:
      - '{{.PYTHON}} -I -B tools/check_intent_record.py "{{.PROPOSAL}}" {{.CLI_ARGS}}'

  intent:qualify:
    desc: "Intent-normalization qualification runner (P-01.2): python -I -B tools/qualify_intent_skill.py ARGS (pass system-prompt, prompt, run or check and their options after --)"
    cmds:
      - '{{.PYTHON}} -I -B tools/qualify_intent_skill.py {{.CLI_ARGS}}'

  # The targets that read the checkout or a repository through the shared repository-access
  # module (Dulwich, decision 0014: create and recreate record the profile revision, smoke
  # takes the inventory snapshots, push writes the exchange bundle) run under the tools
  # interpreter, as gitea:verify and gitea:finalize-credentials (the checkout listing) do.
  # Execution-guest lifecycle (plan leaf F-03.2.2; tools/guest.py). PROFILE and
  # STATE_DIR are always named, never defaulted (profiles/README.md sections 4 and 11).
  guest:preflight:
    desc: Read-only strong-guest capability report (python -I -B tools/guest.py preflight --profile PROFILE --state-dir STATE_DIR)
    requires:
      vars: [PROFILE, STATE_DIR]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py preflight --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}"'

  guest:create:
    desc: Create and boot a disposable guest, then wait until it is ready (<tools python> -I -B tools/guest.py create --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py create --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:start:
    desc: Relaunch a stopped guest from its launch record after re-checking every digest (python -I -B tools/guest.py start --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py start --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:inspect:
    desc: Record a guest's declared and observed state per profiles P1-P12 (python -I -B tools/guest.py inspect --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py inspect --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:exec:
    desc: "Operators only: run a command in the guest over SSH (python -I -B tools/guest.py exec --profile PROFILE --state-dir STATE_DIR --name NAME -- CMD)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py exec --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" -- {{.CLI_ARGS}}'

  guest:push:
    desc: "Exchange push: one local branch of REPO as a bounded git bundle, by SFTP into the guest's exchange directory (<tools python> -I -B tools/guest.py exchange-push --profile PROFILE --state-dir STATE_DIR --name NAME --repo REPO --ref REF)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, REPO, REF]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py exchange-push --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --repo "{{.REPO}}" --ref "{{.REF}}"'

  guest:pull:
    desc: "Exchange pull: one file of the guest's exchange directory into the instance's staging directory; a bundle is verified there (python -I -B tools/guest.py exchange-pull --profile PROFILE --state-dir STATE_DIR --name NAME --file FILE)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, FILE]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py exchange-pull --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --file "{{.FILE}}"'

  guest:canaries:
    desc: Write a synthetic canary set (environment values and a fake home) into a new directory outside the checkout (python -I -B tools/guest.py canaries --out OUT)
    requires:
      vars: [OUT]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py canaries --out "{{.OUT}}"'

  guest:create-canaries:
    desc: create, with a canary set planted in the launching process first (<tools python> -I -B tools/guest.py create --profile PROFILE --state-dir STATE_DIR --name NAME --canaries CANARIES)
    requires:
      vars: [PROFILE, STATE_DIR, NAME, CANARIES]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py create --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --canaries "{{.CANARIES}}"'

  guest:check-surfaces:
    desc: "Startup inspection test for profiles P3-P6 (F-03.3.1): inspect with the canary set; exit 0 only when all four PASS (python -I -B tools/guest.py check-surfaces --profile PROFILE --state-dir STATE_DIR --name NAME --canaries CANARIES)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, CANARIES]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py check-surfaces --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --canaries "{{.CANARIES}}"'

  guest:netprobe:
    desc: "TEST-ONLY network validation for profiles P7 (F-03.3.2; decision 0003, Owner authorization: network validation): a disposable guest with the pinned root probe and one test guestfwd to a 127.0.0.1 listener; exit 0 only on PASS (<tools python> -I -B tools/guest.py netprobe --profile PROFILE --state-dir STATE_DIR --name NAME)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py netprobe --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:stop:
    desc: Stop a guest (QMP system_powerdown, QMP quit after stop_timeout_s, then that process only) (python -I -B tools/guest.py stop --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py stop --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:destroy:
    desc: Stop a guest if it runs, then delete its instance directory only (python -I -B tools/guest.py destroy --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py destroy --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:recreate:
    desc: destroy, then create with the same name and profile (<tools python> -I -B tools/guest.py recreate --profile PROFILE --state-dir STATE_DIR --name NAME)
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py recreate --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:smoke:
    desc: "Provision/inspect/teardown smoke test (F-03.4, profiles P10) on a fresh instance name: preflight, create, inspect, stop, start, inspect, forced stop, recreate, inspect, destroy, with inspect-record and durable-source inventory comparisons; exit 0 only on PASS (<tools python> -I -B tools/guest.py smoke --profile PROFILE --state-dir STATE_DIR --name NAME --canaries CANARIES --durable DURABLE [-- --durable DIR --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, CANARIES, DURABLE]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py smoke --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --canaries "{{.CANARIES}}" --durable "{{.DURABLE}}" {{.CLI_ARGS}}'

  guest:provision-fetch:
    desc: "Host side of guest provisioning (F-04.1a): download every artifact of the profile's provision lock from its upstream, pull the image with the pinned crane, verify all against the lock and stage under STATE_DIR/provision/<lock sha256>/; reuses a verified stage (python -I -B tools/guest.py provision-fetch --profile PROFILE --state-dir STATE_DIR)"
    requires:
      vars: [PROFILE, STATE_DIR]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py provision-fetch --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}"'

  guest:image-inspect:
    desc: "Read-only image check (S-03.3): re-verify the provision-fetch stage against the lock, then read the staged agent-server docker-archive as data (gzip layers streamed and re-hashed, applied as a union view) and report each --path: presence, type, mode, owner, size, last-writing layer, link targets, sha256, a directory's children, PATH#key#key JSON fields; text mode (S-03.3 D-1), every count capped: --list GLOB, --excerpt PATH START END, --search GLOB REGEX, --distinct GLOB REGEX and, for EXE!MODULEGLOB, a PyInstaller executable's PYZ modules (--strings walks their marshal data as data); extracts, runs and writes nothing (python -I -B tools/guest.py image-inspect --profile PROFILE --state-dir STATE_DIR -- [--path PATH ...] [--list GLOB ...] [--excerpt PATH START END ...] [--search GLOB REGEX ...] [--distinct GLOB REGEX ...] [--strings EXE!MODULEGLOB ...] [--context BYTES] [--max-matches N])"
    requires:
      vars: [PROFILE, STATE_DIR]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py image-inspect --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" {{.CLI_ARGS}}'

  guest:create-provisioned:
    desc: "create with --provision (F-04.1b): re-verify the provision-fetch stage and seed its manifest, so the guest's single-use root step can install Moby and the image (<tools python> -I -B tools/guest.py create --profile PROFILE --state-dir STATE_DIR --name NAME --provision)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py create --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --provision'

  guest:provision:
    desc: "Guest side of provisioning (F-04.1b): SFTP the staged .deb files, image archive and release binary into a --provision guest, create READY, wait on the root step's RESULT.json and check it; single use (python -I -B tools/guest.py provision --profile PROFILE --state-dir STATE_DIR --name NAME)"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py provision --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}"'

  guest:conversation-smoke:
    desc: "Contained conversation lifecycle (F-04.2) on a running provisioned guest: the pinned fixture, create (docker runtime, fixed id; non-2xx is a refusal), inspect the conversation and its container from the on-demand root facts (image ID, exact mounts, user, caps, 127.0.0.1 port, P7 allowance), idempotent create, events, inspect, stop the runtime, reopen, delete; exit 0 only on PASS (python -I -B tools/guest.py conversation-smoke --profile PROFILE --state-dir STATE_DIR --name NAME [-- --restart --openapi FILE --canaries DIR --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py conversation-smoke --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" {{.CLI_ARGS}}'

  guest:admission-probe:
    desc: "Management API admission (S-01.3.1) on a running provisioned guest: the pinned route inventory against the running server's /openapi.json, every route without the key and with a wrong one (HTTP and WebSocket), the trusted side with the key, two disposable conversations and from inside each container the management listener, the guest's services, the published ports and the peer container, the keys the agent can read, start_child_conversation's target, the key check, the logged refusals; exit 0 only on PASS (python -I -B tools/guest.py admission-probe --profile PROFILE --state-dir STATE_DIR --name NAME [-- --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py admission-probe --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" {{.CLI_ARGS}}'

  guest:job-access-probe:
    desc: "Job daemon and management access (S-01.3.2) on a running provisioned guest: two disposable conversations; each container's docker inspect against the declared job environment; from inside each job its identity, capabilities, no_new_privs, seccomp, AppArmor, credential-like variable names, sockets and root; every engine socket; the engine API, the management listener, the published ports and the SLIRP host aliases over TCP; every privileged route at every address; the outer key and Gitea tokens by fingerprint; the S-01.4 egress sweep against the egress guard's counters; on a guest with the inference composition the inference sweep, and with --attempt-token-stdin (the token on standard input) the token forwarded, refused after revocation and refused without the forward; exit 0 only on PASS (python -I -B tools/guest.py job-access-probe --profile PROFILE --state-dir STATE_DIR --name NAME [-- --token-fingerprint LABEL=sha256:HEX16 --attempt-token-stdin --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py job-access-probe --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" {{.CLI_ARGS}}'

  guest:acp-qualification:
    desc: "ACP qualification driver (S-03.3 slice 5; PREPARED, NOT RUN: every live step is an Owner act) on a running guest created with create --provision --inference, the forward held: reads one attempt token on standard input (inference_control.py issue --conversation-id a0333c00-0000-4000-8000-0000000ac0d1 ... | this target), admits and sends the pinned qualification create through the dispatcher's transport, sends one fixed prompt, observes the conversation container while the turn runs and after it (processes, connections, the job contract), reads the events and the sets of containers and conversations, searches for the provider key (off by default), revokes the token and deletes the conversation, under the decision rule fixed before any run; exit 0 only on PASS (python -I -B tools/guest.py acp-qualification --profile PROFILE --state-dir STATE_DIR --name NAME --attempt-token-stdin --prompt single|delegated --acp-model MODEL [-- --key-search synthetic --provider-key-fingerprint sha256:HEX16 | --key-search real --real-key-act ACT --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, PROMPT, ACP_MODEL]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py acp-qualification --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --attempt-token-stdin --prompt "{{.PROMPT}}" --acp-model "{{.ACP_MODEL}}" {{.CLI_ARGS}}'

  guest:inference-forward:
    desc: "The inference forward session (S-03.2, decision 0015 sections 4.1, 4.3 and 4.4) of a guest created with create --provision --inference: start holds ssh -N -R 172.17.0.1:8090:127.0.0.1:<broker inference port> over the instance's hostfwd with the per-instance key (a detached holder writes <instance>/inference-forward.json while the session is held and removes it when the session ends; start is idempotent and replaces a stale record), status reads it, stop ends it; the broker's port comes from components.inference_broker and its control listener must report it first. Needs the Owner's acts A2, A3 and A4 (python -I -B tools/guest.py inference-forward --profile PROFILE --state-dir STATE_DIR --name NAME --action ACTION [-- --broker-port PORT])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME, ACTION]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py inference-forward --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" --action "{{.ACTION}}" {{.CLI_ARGS}}'

  guest:containment-probe:
    desc: "Containment probes (S-02.1) on a running provisioned guest: the versioned catalogue security/containment-cases.json in one pass (admission-probe and job-access-probe unchanged; the rest from inside two further disposable conversation containers with generated canary workspaces); per case the attempt, principal, observations, positive control and verdict (PASS, FAIL or UNKNOWN) with the runtime-configuration snapshot; --sensitivity also runs the live mutations; exit 0 only on PASS (python -I -B tools/guest.py containment-probe --profile PROFILE --state-dir STATE_DIR --name NAME [-- --sensitivity --token-fingerprint LABEL=sha256:HEX16 --out FILE])"
    requires:
      vars: [PROFILE, STATE_DIR, NAME]
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py containment-probe --profile "{{.PROFILE}}" --state-dir "{{.STATE_DIR}}" --name "{{.NAME}}" {{.CLI_ARGS}}'

  guest:host-census:
    desc: "Read-only, unelevated census (S-01.4) of the harness's host listeners by PID (QEMU, the host Gitea, the Owner host's Vite servers; each must be on 127.0.0.1) and the Windows Firewall profiles and rule count, recorded as disclosure; changes no rule; exit 0 only on PASS (python -I -B tools/guest.py host-census [-- --exclude-pid PID --out FILE])"
    cmds:
      - '{{.PYTHON}} -I -B tools/guest.py host-census {{.CLI_ARGS}}'

  hooks:install:
    desc: Install the publication-safety gate (python -I -B tools/publication_gate.py install); downloads and verifies the pinned Gitleaks into the per-user cache, sets core.hooksPath
    cmds:
      - '{{.PYTHON}} -I -B tools/publication_gate.py install'

  # The gate itself stays on the plain PYTHON (standard library, offline); its test suite, whose
  # test 7 reruns the whole tool suite, runs under the python-tools interpreter (plan leaf F-10.2).
  hooks:verify:
    desc: "Verify the gate (python -I -B tools/publication_gate.py verify), then run its synthetic test suite under the python-tools interpreter with AIEH_GATE_REQUIRE_SCANNER=1, which also runs test 7's nested whole-tool-suite rerun (<tools python> -I -B -m unittest discover -s tools/tests -p test_publication_gate.py -v)"
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
    env:
      AIEH_GATE_REQUIRE_SCANNER: '1'
    cmds:
      - '{{.PYTHON}} -I -B tools/publication_gate.py verify'
      - '"{{.TOOLS_PYTHON}}" -I -B -m unittest discover -s tools/tests -p test_publication_gate.py -v'

  scan:history:
    desc: Read-only, redacted scan of every commit (python -I -B tools/publication_gate.py history); pass -- REVS to narrow it
    cmds:
      - '{{.PYTHON}} -I -B tools/publication_gate.py history {{.CLI_ARGS}}'

  resolve:
    desc: "Resolve and verify the component lock under the python-tools interpreter, whose Dulwich reads the source tags (<tools python> -I -B composition/resolve.py --work WORK); WORK must be empty or absent and outside the checkout"
    requires:
      vars: [WORK]
    vars:
      TOOLS_PYTHON:
        sh: '{{.PYTHON}} -I -B integrations/paths/tools_install.py --python'
      PYTHON: '"{{.TOOLS_PYTHON}}"'
    cmds:
      - '{{.PYTHON}} -I -B composition/resolve.py --work "{{.WORK}}"'

  inventory:
    desc: "Optional: component metadata inventory from a resolver work directory (python -I composition/inventory/metadata_inventory.py --resolved RESOLVED --out OUT)"
    requires:
      vars: [RESOLVED, OUT]
    cmds:
      - '{{.PYTHON}} -I composition/inventory/metadata_inventory.py --resolved "{{.RESOLVED}}" --out "{{.OUT}}"'

  sbom:
    desc: "Optional, Windows x86_64: Syft SBOMs and Grant licence findings (python -I composition/inventory/scan.py --resolved RESOLVED --tools TOOLS --out OUT)"
    requires:
      vars: [RESOLVED, TOOLS, OUT]
    cmds:
      - '{{.PYTHON}} -I composition/inventory/scan.py --resolved "{{.RESOLVED}}" --tools "{{.TOOLS}}" --out "{{.OUT}}" {{.CLI_ARGS}}'
